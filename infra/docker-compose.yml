name: OmniSpot

services:
  core:
    container_name: core
    image: omnispot-core:latest
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: php artisan migrate
    volumes:
      - ./.env:/var/www/.env:rw
      - app-uploads:/var/www/storage/app/public
      - app-logs:/var/www/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  
  api:
    image: omnispot-core:latest
    pull_policy: build
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - app-uploads:/var/www/storage/app/public
      - app-logs:/var/www/storage/logs
    scale: 2
    depends_on:
      core:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  load-balancer:
    container_name: load-balancer
    image: nginx:latest
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/static:/var/www/public:ro
    ports:
      - "8000:80"

  postgres:
    container_name: postgres
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5
    
  redis:
    container_name: redis
    image: redis:8-alpine
    restart: always
    command: redis-server --save 60 1 --loglevel notice --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  radius:
    container_name: radius
    image: freeradius/freeradius-server:3.2.10
    restart: always
    ports:
      - "1812:1812/udp" # RADIUS Authentication
      - "1813:1813/udp" # RADIUS Accounting
    volumes:
      - ./radius/config/clients.conf:/etc/freeradius/clients.conf:ro
      - ./radius/config/mods-enabled/rest:/etc/freeradius/mods-enabled/rest:ro
      - ./radius/config/sites-enabled/default:/etc/freeradius/sites-enabled/default:ro
      - ./radius/dictionary:/etc/freeradius/dictionary:ro
    # Run in debug mode (-X) during initial testing to see HTTP payloads live
    command: freeradius -X
    depends_on:
      api:
        condition: service_started

volumes:
  app-uploads:
  app-logs:
  postgres-data:
  redis-data: