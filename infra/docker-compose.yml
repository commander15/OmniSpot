name: OmniSpot

services:
  proxy:
    image: commander15/proxoid:latest
    restart: unless-stopped
    volumes:
      - ./nginx/clusters.conf:/etc/nginx/clusters.conf:ro
      - ./nginx/endpoints.conf:/etc/nginx/endpoints.conf:ro
      - proxy-state:/etc/nginx/state
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - omni-net
    deploy:
      resources:
        limits:
          memory: 512m
    profiles:
      - kernel

  api:
    image: omnispot-core:latest
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
      - ./laravel/.env
    volumes:
      - api-uploads:/var/www/storage/app/public
      - api-logs:/var/www/storage/logs
    networks:
      - omni-net
    deploy:
      resources:
        limits:
          memory: 512m
    scale: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    image: omnispot-core:latest
    restart: unless-stopped
    command: php artisan schedule:work
    env_file:
      - ./.env
      - ./laravel/.env
    volumes:
      - api-uploads:/var/www/storage/app/public
      - api-logs:/var/www/storage/logs
    networks:
      - omni-net
    deploy:
      resources:
        limits:
          memory: 128m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    image: omnispot-core:latest
    restart: unless-stopped
    command: php artisan queue:work
    env_file:
      - ./.env
      - ./laravel/.env
    volumes:
      - api-uploads:/var/www/storage/app/public
      - api-logs:/var/www/storage/logs
    networks:
      - omni-net
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - omni-net
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --loglevel notice --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - omni-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m

  radius:
    image: freeradius/freeradius-server:3.2.10
    # Run in debug mode (-X) during initial testing to see HTTP payloads live
    command: freeradius -X
    restart: always
    ports:
      - "${RADIUS_HOST:-0.0.0.0}:${RADIUS_AUTH:-1812}:1812/udp" # RADIUS Authentication
      - "${RADIUS_HOST:-0.0.0.0}:${RADIUS_ACCT:-1813}:1813/udp" # RADIUS Accounting
      - "${RADSEC_HOST:-0.0.0.0}:${RADSEC_PORT:-2083}:2083/tcp" # RadSec
    volumes:
      - ./radius/config/clients.conf:/etc/freeradius/clients.conf:ro
      - ./radius/config/mods-enabled/rest:/etc/freeradius/mods-enabled/rest:ro
      - ./radius/config/sites-enabled/default:/etc/freeradius/sites-enabled/default:ro
      - ./radius/dictionary:/etc/freeradius/dictionary:ro
    networks:
      - omni-net
    deploy:
      resources:
        limits:
          memory: 256m
    depends_on:
      api:
        condition: service_started

volumes:
  proxy-state:
  api-uploads:
  api-logs:
  postgres-data:
  redis-data:

networks:
  omni-net:
    driver: bridge
