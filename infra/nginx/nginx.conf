events {
    worker_connections 2048;
}

http {
    # CRITICAL: Missing standard MIME types (fixes CSS/JS rendering issues)
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format custom '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      'upstream: $upstream_addr time: $request_time';

    access_log /var/log/nginx/access.log custom;
    error_log /var/log/nginx/error.log warn;

    # API cluster definition
    upstream api_cluster {
        least_conn;
        server api:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name omnispot;

        # Define root and index once globally for this server block
        root /var/www/public;
        index index.html;

        client_max_body_size 20M;

        # SPA Routing: Handles fallback to index.html for client-side routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Static Assets: Regex matching for performance caching
        location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|mp4)$ {
            # Inherits root from server level automatically
            expires 10m;
            access_log off;
            add_header Cache-Control "public, no-transform";
            
            # Fixes deep-linking refresh crashes on static assets
            try_files $uri =404; 
        }
        
        # Proxy to API Cluster
        location /api/v1 {
            proxy_pass http://api_cluster/v1; # Simplified to cleanly pass URI trailing paths

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Health Check Endpoint
        location /health {
            return 200 '{"status":"UP"}';
            add_header Content-Type application/json;
        }
    }
}

