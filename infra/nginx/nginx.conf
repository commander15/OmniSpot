events {
    worker_connections 2048;
}

http {
    # Logging configuration
    log_format custom '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      'upstream: $upstream_addr time: $request_time';

    access_log /var/log/nginx/access.log custom;
    error_log /var/log/nginx/error.log warn;

    # Frontend cluster
    upstream frontend_cluster {
        # Routing strategy: least_conn sends traffic to the server with fewest active connections
        least_conn;

        # "frontend" matches the service name in docker-compose.yml on port 8000
        server frontend:80 max_fails=3 fail_timeout=10s;

        # Keep persistent connections open to backends to reduce latency
        keepalive 32;
    }

    # Load balancing cluster definition
    upstream api_cluster {
        # Routing strategy: least_conn sends traffic to the server with fewest active connections
        least_conn;

        # "api" matches the service name in docker-compose.yml on port 8000
        server api:8000 max_fails=3 fail_timeout=10s;

        # Keep persistent connections open to backends to reduce latency
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Max payload size (useful for upload limits)
        client_max_body_size 20M;

        location / {
            proxy_pass http://frontend_cluster;

            # HTTP 1.1 + Keep-Alive support
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Pass true client connection metadata down to the REST API
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout configurations
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
        
        location /api {
            proxy_pass http://api_cluster/api;

            # HTTP 1.1 + Keep-Alive support
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Pass true client connection metadata down to the REST API
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout configurations
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Optional: Health Check Endpoint for Nginx itself
        location /health {
            return 200 '{"status":"UP"}';
            add_header Content-Type application/json;
        }
    }
}
